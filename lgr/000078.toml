    "cgitsync3.2.0 Fixes autofix answering 'no failing command found in the run log' straight after a merge had visibly failed: a command saved its log only when it also wrote a State, and a refused merge writes none, so the one run worth diagnosing was the one that left no trace.\nAutofix now names the repositories and files a conflict is still blocking, a refusal says which branch it was merging instead of only which files clashed, and a plain merge records the branch it merged into and the State it produced. Tutorial 4 gains a section on finishing a conflicted merge by hand when no merge tool is configured.",
