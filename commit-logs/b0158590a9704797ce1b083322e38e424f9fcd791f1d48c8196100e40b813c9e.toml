message = "cgitsync-8.9.3 TwinMemoryMerge: merge, merge --into and merge --resolve now derive every branch through the one resolver that checkout uses, so a bootstrap twin's memory and its self-history follow the project instead of being skipped\nA memory that is only behind fast-forwards, and one that has no branch to follow the project on refuses the merge before anything moves, naming the memory branch command\nTutorial 7, the user guide and AdditionalSpecs say so; MountGuard.base, now unused, is removed"
