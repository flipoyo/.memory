message = "cgitsync-7.1.1 omniscience register now refuses, before writing anything, a file the register already holds under the same name with other content, so a content-address collision or a hand-edited register can never edit a record; the same bytes again change nothing. Tests now show a push the provider refuses is reported unchanged and never retried, and that a tree keeps one os_id however it is installed or restored."
