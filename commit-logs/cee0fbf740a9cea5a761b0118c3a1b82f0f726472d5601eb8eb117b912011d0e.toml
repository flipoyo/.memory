sha = "a3f4c569276dd138d6dfb7dcde5fe91c95503820"
message = "cgitsync-7.1.0 verify now reports a memory whose commit messages were deleted by the memory push fold before 6.8.1 as incomplete, exit 0, listing each lost entry as COMMIT_LOG_LOST and counting them, instead of calling it corrupt.\nThe build that wrote an entry is inside the entry's hash, so it cannot be edited to excuse a loss; a partial, changed or later loss is still corrupt, and nothing is repaired. branch close and branch delete, which refuse a corrupt ledger, now run on such a tree."
authored_at = "2026-10-27T03:59:29+01:00"

