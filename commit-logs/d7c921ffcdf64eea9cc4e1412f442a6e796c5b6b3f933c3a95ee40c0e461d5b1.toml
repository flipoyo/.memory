message = "HydrologicalTwinAlphaSeries-1.2.0 Add the htas-dev command line: one command per developer verb and one subcommand per kind (htas-dev fetch simulation-matrix), generated from a new kinds registry in ht/developer and from the request dataclasses\nEvery request field is an option, array and mapping fields read .npy, .json or vector files, --output writes the result, --json shows long arrays as shapes; describe reads its catalog from the registry and gains mask_kinds and assemble_kinds\nDocument the command in the API docs, the user guide, the README and the specs, and share one parse and exit-code runner between htas and htas-dev"
