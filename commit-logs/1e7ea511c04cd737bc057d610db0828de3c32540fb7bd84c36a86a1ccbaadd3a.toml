entry = 79
repository = "DocComplexGitSync"
repo_id = "root:docs"
scope = "project"
branch = "main"
sha = "f4ebb73d9d130743c02583edda2496f4c70d8f66"
message = "cgitsync-7.3.0 every writing command now takes one advisory lock per workspace (.cgitsync/.lock, never folded or pushed) and a second writer is refused before it touches any repository, naming the holder and the lock's age.\ncgitsync unlock clears a lock whose process is gone (a live holder only with --force); a ledger entry that could not be written now reaches the person as a warning. pull locks the workspace its source sits in, pull --private is covered too, and the tests include two real processes."
authored_at = "2026-10-27T17:12:39+01:00"

