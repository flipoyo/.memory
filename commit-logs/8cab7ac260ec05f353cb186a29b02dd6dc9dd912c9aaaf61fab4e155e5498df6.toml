message = "cgitsync-6.10.0 Omniscience can now be asked: omniscience get, branches, history, state, proof, verify, status, report and memory read the shared register without writing to it, with a checkable proof for each State. Every answer is verified, invalid, unavailable, unauthorized or not_registered. A registered memory is read at its exact commit in a temporary clone that is removed, and a failed read is never reported as deleted. A new eighth tutorial, Omniscience, is tested end to end; the README, user guide and API guide are updated."
