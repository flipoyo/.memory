[[commit]]
entry = 57
repository = "DocComplexGitSync"
repo_id = "root:docs"
scope = "project"
branch = "main"
sha = "b6cc187adc7f699368155929e94ffd89ec6ebcef"
message = "cgitsync-6.8.1 Omniscience registration: a record format with H_OS_STATE and a global index root (GLOBAL_SCHEMA 1), plus omniscience mount (developer trees only) and omniscience record, which register nothing. The memory push fold now keeps each commit message and publication row; it read the pending commit logs from the wrong directory and deleted them, so every one was lost at the first fold. Rows already lost are not recovered."
authored_at = "2026-10-21T13:34:59+02:00"

