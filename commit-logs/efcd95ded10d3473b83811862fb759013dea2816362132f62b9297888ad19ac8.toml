message = "cgitsync-8.7.0 LinkAtCGS: a yyyy-xxx.cgs now falls back to CGS-ALPHA, then main, and one still naming the beta branch is refused by name; every reference to the beta branch leaves the code, examples, specs and open tickets, and the molonari OpFrontier targets ComplexGraphSync. The developer spec keeps CGS-ALPHA first for ComplexGitSync and DocComplexGitSync, its private entries taking the derived branch; the ticket is renamed LinkAtCGS and moves to CGS-ALPHA. Release level: MINOR."
