message = "cgitsync-7.3.0 ticket review integrates the short ticket gitRepo: SrcLayout splits src into GitRepo, Merkle, Tree and OperatingSpace before beta, with GitRepo a dependency that imports nothing back, and MerkleRoot lives in Merkle. The Omniscience register is gx4g's: ProviderMigration now covers its writes, and BranchProtection hands dead-branch findings to gx4g instead of writing them. BeforeBeta gains step S8 and constraints 6 and 7; Minimalism maps folders and the GitRepo boundary; AdditionalSpecs and the digest carry the register rule."
